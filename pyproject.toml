[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awb"
version = "0.0.1"
description = "Agent workbench CLI for multi-agent ledger collaboration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
awb = "awb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["awb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
