name: relay tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q

  lint:
    name: pyflakes, ruff, shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pyflakes ruff
      - run: python -m pyflakes skills/agent-relay/bin/relay skills/agent-relay/hooks/relay-hook.py
      - run: python -m ruff check skills/agent-relay/bin/relay skills/agent-relay/hooks/relay-hook.py
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -s bash skills/agent-relay/templates/envrc.dispatcher.example
